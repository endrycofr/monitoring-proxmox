[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

# Output ke InfluxDB 2.x
[[outputs.influxdb_v2]]
  urls = ["http://<IP_INFLUXDB>:8086"]
  token = "<INFLUXDB_API_TOKEN>"
  organization = "<INFLUXDB_ORG>"
  bucket = "<INFLUXDB_BUCKET>"

# Input Plugin untuk Ceph
[[inputs.ceph]]
  # Kosongkan atau sesuaikan jika binary dicek via path container
  use_sudo = false
